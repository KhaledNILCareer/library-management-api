/api/books:
  get:
    tags: [Books]
    summary: Get books
    description: Public catalog endpoint with pagination and filters.
    parameters:
      - in: query
        name: page
        schema: { type: integer, minimum: 1, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      - in: query
        name: search
        schema: { type: string }
      - in: query
        name: author
        schema: { type: string }
      - in: query
        name: available
        schema: { type: boolean }
    responses:
      '200':
        description: Books retrieved successfully
      '400':
        description: Invalid query parameters

  post:
    tags: [Books]
    summary: Create a book
    description: Admin or Librarian only.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              [title, description, ISBN, author, category, totalCopies, availableCopies]
            properties:
              title: { type: string, example: "1984" }
              description: { type: string, example: "Dystopian novel" }
              ISBN: { type: string, example: "9780451524935" }
              author: { type: string, description: "Author ObjectId" }
              category: { type: string, example: "Fiction" }
              totalCopies: { type: integer, minimum: 0, example: 3 }
              availableCopies: { type: integer, minimum: 0, example: 3 }
    responses:
      '201':
        description: Book created successfully
      '400':
        description: Invalid or missing book data
      '401':
        description: Authentication required
      '403':
        description: Admin or Librarian role required
      '404':
        description: Author not found
      '409':
        description: Duplicate ISBN

/api/books/{id}:
  get:
    tags: [Books]
    summary: Get a book by ID
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Book retrieved successfully
      '400':
        description: Invalid book ID
      '404':
        description: Book not found

  patch:
    tags: [Books]
    summary: Update a book
    description: Admin or Librarian only.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              ISBN: { type: string }
              author: { type: string }
              category: { type: string }
              totalCopies: { type: integer, minimum: 0 }
              availableCopies: { type: integer, minimum: 0 }
    responses:
      '200':
        description: Book updated successfully
      '400':
        description: Invalid ID or invalid book data
      '401':
        description: Authentication required
      '403':
        description: Admin or Librarian role required
      '404':
        description: Book or author not found
      '409':
        description: Duplicate ISBN

  delete:
    tags: [Books]
    summary: Delete a book
    description: Admin or Librarian only. Deletion is blocked while copies are borrowed.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Book deleted successfully
      '400':
        description: Invalid book ID
      '401':
        description: Authentication required
      '403':
        description: Admin or Librarian role required
      '404':
        description: Book not found
      '409':
        description: Book has active borrowed copies

/api/books/{id}/borrow:
  post:
    tags: [Borrowing]
    summary: Borrow a book
    description: Member only.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        description: Book ID
        schema: { type: string }
    responses:
      '201':
        description: Book borrowed successfully
      '400':
        description: Invalid book ID
      '401':
        description: Authentication required
      '403':
        description: Member role required
      '404':
        description: Book not found
      '409':
        description: No available copies or duplicate active borrowing
