/api/users:
  get:
    tags: [Users]
    summary: Get all users
    description: Admin only.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Users retrieved successfully
      '401':
        description: Authentication required
      '403':
        description: Admin role required

/api/users/{id}/role:
  patch:
    tags: [Users]
    summary: Update a user's role
    description: Admin only. An admin cannot change their own role.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role]
            properties:
              role:
                type: string
                enum: [admin, librarian, member]
    responses:
      '200':
        description: User role updated successfully
      '400':
        description: Invalid ID, invalid role, or self-role change
      '401':
        description: Authentication required
      '403':
        description: Admin role required
      '404':
        description: User not found

/api/users/{id}:
  delete:
    tags: [Users]
    summary: Delete a user
    description: Admin only. An admin cannot delete their own account.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      '200':
        description: User deleted successfully
      '400':
        description: Invalid ID or attempt to delete own account
      '401':
        description: Authentication required
      '403':
        description: Admin role required
      '404':
        description: User not found
